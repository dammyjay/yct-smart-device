<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard</title>
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="icon" href="/Images/yct-logo.png" type="image/x-icon" />
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script defer src="/js/dashboard.js"></script>
  </head>
  <body>

    <!-- Top Bar: Hamburger + Notification + Profile -->
    <div class="top-bar">
      <!-- <div class="hamburger" onclick="toggleMobileMenu()">☰</div> -->
      <div class="hamburger" id="hamburger-menu">☰</div>

      <h6>Device Status:</h6>
      <p style="font-size: 12px" id="device-status">Checking status...</p>

      <!-- <div id="people-count">👥 People: 0</div> -->
       <!-- <div class="card">
        <h3>People Count</h3>
        <p id="people-count">0</p>
      </div> -->


      <!-- <div class="notif-wrapper" onclick="toggleNotifications()">
        🔔 <span id="notif-count">0</span>
      </div> -->

      <div class="profile-icon" onclick="toggleProfileMenu()">👤</div>

      <div class="profile-menu" id="profileMenu">
        <a href="#" onclick="openEditProfile()">Edit Profile</a>
        <!-- <select id="device-selector"></select> -->
        <a href="/logout">Logout</a>
      </div>
    </div>

    <div class="notification-dropdown" id="notif-dropdown">
      <h4>Notifications</h4>
      <ul id="notif-list"></ul>
    </div>

    <div class="home-screen">


      <div class="form-container3" style="width: 100%;">
        <h2>Live Video Feed</h2>
        <p id="camera-status">Checking camera...</p>

        <!-- Manual URL input -->
        <input type="text" id="manual-camera-url" placeholder="Enter stream URL" style="width: 80%;" />
        <button onclick="setManualCameraUrl()">Load Stream</button>

        <div style="text-align: center; margin-top:10px;">
          <!-- <iframe id="live-stream" style="width: 100%; max-width: 100%; height: 400px; border: none; border-radius: 8px;" >
            
          </iframe> -->
          <iframe id="live-stream" src="/proxy-stream/stream_simple.html"
            style="width: 100%; max-width: 100%; height: 400px; border: none; border-radius: 8px;">
          </iframe>

        </div>
      </div>



      <div class="form-container3">
        <h2>Smart Control Dashboard</h2>
        <button class="toggle-btn">Turn ON Channel 1</button>
        <button class="toggle-btn">Turn ON Channel 2</button>
        <button class="toggle-btn">Turn ON Channel 3</button>
        <button class="toggle-btn">Turn ON Channel 4</button>
      </div>
    </div>

    <!-- Edit Profile Modal -->
    <div id="edit-profile-modal" class="modal-overlay">
      <div class="modal-box">
        <span class="close-btn" onclick="closeEditModal()">❌</span>
        <h3>Edit Profile</h3>
        <form id="edit-profile-form">
          <input type="text" name="full_name" required />
          <input type="email" name="email" required />
          <div
            id="qr-reader"
            style="width: 100%; max-width: 300px; margin: auto"
          ></div>
          <input type="text" name="device_id" id="device_id" />
           <!-- ✅ Add this field for camera URL -->
          <input type="text" name="camera_url" placeholder="Camera Stream URL" />
          <button type="submit">Save</button>
        </form>
      </div>
    </div>

    <div id="mobile-sidebar" class="mobile-sidebar">
      <a href="#">🏠 Dashboard</a>
      <a href="#" onclick="openEditProfile()">Edit Profile</a>
      <a href="/logout">Logout</a>
    </div>

  </body>
</html>
